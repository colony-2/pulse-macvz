name: Ubuntu 26.04 VM images
on:
  workflow_dispatch:
    inputs:
      release_url:
        description: Ubuntu cloud-image release directory containing both architectures
        required: true
        default: https://cloud-images.ubuntu.com/releases/26.04/release
      arm64_sha256:
        description: Published SHA256 of ubuntu-26.04-server-cloudimg-arm64.img
        required: true
      amd64_sha256:
        description: Published SHA256 of ubuntu-26.04-server-cloudimg-amd64.img
        required: true
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner_arch: ARM64
          - arch: amd64
            runner_arch: X64
    runs-on: [self-hosted, macOS, "${{ matrix.runner_arch }}"]
    timeout-minutes: 120
    env:
      IMAGE_ARCH: ${{ matrix.arch }}
      RELEASE_URL: ${{ inputs.release_url }}
      CLOUD_SHA256: ${{ matrix.arch == 'arm64' && inputs.arm64_sha256 || inputs.amd64_sha256 }}
      VM_NAME: pulse-ubuntu-26-04-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download and build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/$VM_NAME"
          disk="$RUNNER_TEMP/$VM_NAME/ubuntu.img"
          curl --fail --location --retry 3 --output "$disk" \
            "${RELEASE_URL%/}/ubuntu-26.04-server-cloudimg-$IMAGE_ARCH.img"
          ./scripts/build-linux-image.sh "$IMAGE_ARCH" "$VM_NAME" "$disk" "$CLOUD_SHA256"
          tart export "$VM_NAME" "$RUNNER_TEMP/$VM_NAME/ubuntu-26.04-$IMAGE_ARCH.tvm"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ubuntu-26.04-${{ matrix.arch }}
          path: ${{ runner.temp }}/${{ env.VM_NAME }}/*.tvm
          if-no-files-found: error
          compression-level: 0
      # Keep failed VMs and build logs for diagnosis. Successful local images
      # can be published after qualification and pinned in the default catalog.
